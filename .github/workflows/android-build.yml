name: Build The Long Way Home APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch, and verify New Life inside Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.thelongwayhome.game/.MainActivity --ez smokeTest true
            sleep 8
            test -n "$(adb shell pidof com.thelongwayhome.game | tr -d '\r')"
            adb shell dumpsys activity activities | grep -q "com.thelongwayhome.game"
            adb logcat -d -s LWH_SMOKE:I '*:S' | tee smoke.log
            grep -q "LWH_SMOKE: true" smoke.log
            adb exec-out screencap -p > app-after-new-life.png
            adb shell am force-stop com.thelongwayhome.game
            adb shell am start -W -n com.thelongwayhome.game/.MainActivity
            sleep 5
            adb exec-out screencap -p > app-title.png

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Long-Way-Home-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload launch screenshots
        uses: actions/upload-artifact@v4
        with:
          name: The-Long-Way-Home-emulator-test
          path: |
            app-title.png
            app-after-new-life.png
          if-no-files-found: error
