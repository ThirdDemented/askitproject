name: Validate, build and review The Long Way Home

on:
  push:
    branches: [main, codex/commercial-quality]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only the version whose complete evidence gate has passed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: long-way-home-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and artwork manifest
        run: |
          node --check app/src/main/assets/www/game.js
          python scripts/check_release.py --source-only
      - name: Reconstruct verified illustrated assets
        run: |
          python -m pip install -r requirements-art.txt
          python scripts/rebuild_art.py
          python scripts/launcher.py
      - name: Install browser QA dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Full gameplay and screen regression
        run: npm test
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install API 36
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore private release signing key
        env:
          LWH_SIGNING_KEY: ${{ secrets.LWH_SIGNING_KEY }}
        run: |
          test -n "$LWH_SIGNING_KEY"
          umask 077
          printf '%s' "$LWH_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/lwh-release.p12"
      - name: Build signed APK and App Bundle
        env:
          LWH_KEYSTORE: ${{ runner.temp }}/lwh-release.p12
          LWH_KEY_PASSWORD: ${{ secrets.LWH_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease :app:assembleReleaseAndroidTest --stacktrace
      - name: Verify signatures and permanent package ID
        run: |
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee signing-verification.txt
          EXPECTED="$(tr '[:upper:]' '[:lower:]' < signing-certificate.sha256 | tr -d '\r\n')"
          grep -qi "$EXPECTED" signing-verification.txt
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | tee package-verification.txt
          grep -q "com.thirdemented.longwayhome.release2026" package-verification.txt
          grep -q "targetSdkVersion:'36'" package-verification.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Signed release Android verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: false
          script: bash qa/android_qa.sh
      - name: Generate store package from reviewed game assets
        run: |
          python scripts/store_assets.py
          python scripts/collect_evidence.py
      - name: Collect review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-way-home-review-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            qa/captures/
            qa/results/
            *-portrait.png
            *-landscape.png
            *-smoke.log
            *-verification.txt
            store/generated/
            The-Long-Way-Home-Play-Store-Kit.zip
            The-Long-Way-Home-QA-Evidence.zip
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/lwh-release.p12"

  publish:
    needs: quality
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Enforce every reviewed release gate
        run: |
          python -m pip install -r requirements-art.txt
          python scripts/check_release.py
      - uses: actions/download-artifact@v4
        with:
          name: long-way-home-review-${{ github.sha }}
          path: release-files
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python -c "import json;print(json.load(open('qa/release-gates.json'))['version'])")"
          cp release-files/app/build/outputs/apk/release/app-release.apk "The-Long-Way-Home-${VERSION}.apk"
          cp release-files/app/build/outputs/bundle/release/app-release.aab "The-Long-Way-Home-${VERSION}.aab"
          cp release-files/The-Long-Way-Home-Play-Store-Kit.zip .
          cp release-files/The-Long-Way-Home-QA-Evidence.zip .
          sha256sum "The-Long-Way-Home-${VERSION}.apk" "The-Long-Way-Home-${VERSION}.aab" The-Long-Way-Home-Play-Store-Kit.zip The-Long-Way-Home-QA-Evidence.zip > SHA256SUMS.txt
          gh release create "v${VERSION}" "The-Long-Way-Home-${VERSION}.apk" "The-Long-Way-Home-${VERSION}.aab" The-Long-Way-Home-Play-Store-Kit.zip The-Long-Way-Home-QA-Evidence.zip SHA256SUMS.txt --title "The Long Way Home ${VERSION}" --notes-file store/RELEASE_NOTES.md
