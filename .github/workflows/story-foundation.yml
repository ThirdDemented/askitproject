name: Integrated story candidate (no publication)
on:
  push:
    branches: [codex/chaos-phase1]
  pull_request:
    paths:
      - 'app/**'
      - 'qa/**'
      - 'scripts/**'
      - '.github/workflows/story-foundation.yml'
permissions:
  contents: read
concurrency:
  group: story-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Materialize the verified integration source
        run: python scripts/apply_story_integration.py
      - name: Commit the materialized source only to the expansion branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/chaos-phase1'
        run: |
          if ! git diff --quiet; then
            REMOTE="$(git ls-remote origin refs/heads/codex/chaos-phase1 | cut -f1)"
            test "$REMOTE" = "$GITHUB_SHA"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/build.gradle.kts app/src/main/assets/www/game.js app/src/main/assets/www/index.html app/src/main/assets/www/story-scenes.js app/src/androidTest/java/com/thelongwayhome/game/GameReleaseTest.java qa/android_qa.sh qa/game-qa.cjs qa/release-gates.json scripts/story-integration.pending
            git commit -m 'Integrate diner and tire scenes into the journey; preserve build 104'
            git push origin HEAD:refs/heads/codex/chaos-phase1
          fi
      - name: Record exact source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: State, adapter and fuel regression
        run: |
          for FILE in app/src/main/assets/www/*.js; do node --check "$FILE"; done
          node --test qa/story-engine.test.cjs qa/story-bridge.test.cjs
          node qa/fuel-qa.cjs
      - name: Reconstruct verified artwork
        run: |
          python -m pip install -r requirements-art.txt
          python scripts/rebuild_art.py
          python scripts/check_release.py --source-only
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Full-game, prototype and integrated-journey browser checks
        run: |
          node qa/game-qa.cjs
          node qa/story-browser.cjs
          node qa/story-journey.cjs
      - name: Save review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-integration-evidence-${{ github.run_id }}
          path: |
            qa/results/
            qa/captures/
          if-no-files-found: warn

  android_candidate:
    needs: foundation
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/chaos-phase1'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.foundation.outputs.source_sha }}
      - name: Reconstruct release artwork
        run: |
          python -m pip install -r requirements-art.txt
          python scripts/rebuild_art.py
          python scripts/launcher.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore existing private signing key
        env:
          LWH_SIGNING_KEY: ${{ secrets.LWH_SIGNING_KEY }}
        run: |
          test -n "$LWH_SIGNING_KEY"
          umask 077
          printf '%s' "$LWH_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/lwh-release.p12"
      - name: Compile signed candidate and test APK
        env:
          LWH_KEYSTORE: ${{ runner.temp }}/lwh-release.p12
          LWH_KEY_PASSWORD: ${{ secrets.LWH_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease :app:assembleReleaseAndroidTest --stacktrace
      - name: Verify unchanged identity and release certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee signing-verification.txt
          EXPECTED="$(tr '[:upper:]' '[:lower:]' < signing-certificate.sha256 | tr -d '\r\n')"
          grep -qi "$EXPECTED" signing-verification.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | tee package-verification.txt
          grep -Fq "package: name='com.thirdemented.thelongwayhome'" package-verification.txt
          grep -Fq "versionName='1.2.0-alpha.1'" package-verification.txt
          grep -Fq "targetSdkVersion:'36'" package-verification.txt
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Baseline plus integrated-encounter Android checks
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: false
          script: bash qa/android_qa.sh
      - name: Assemble owner-playtest candidate only after passing checks
        env:
          REVIEWED_SOURCE_SHA: ${{ needs.foundation.outputs.source_sha }}
        run: |
          mkdir -p candidate
          cp app/build/outputs/apk/release/app-release.apk candidate/The-Long-Way-Home-1.2.0-alpha.1.apk
          cp app/build/outputs/bundle/release/app-release.aab candidate/The-Long-Way-Home-1.2.0-alpha.1.aab
          printf 'Owner playtest only. Not approved for Google Play.\nSource commit: %s\nWorkflow run: %s\n' "$REVIEWED_SOURCE_SHA" "$GITHUB_RUN_ID" > candidate/BUILD-INFO.txt
          (cd candidate && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: long-way-home-phone-test-${{ github.run_id }}
          path: candidate/
          if-no-files-found: error
      - name: Retain native QA evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-android-evidence-${{ github.run_id }}
          path: |
            *-portrait.png
            *-landscape.png
            *-portrait.json
            *-landscape.json
            *-smoke.log
            *-verification.txt
          if-no-files-found: warn
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/lwh-release.p12"
