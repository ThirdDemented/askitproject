name: Story foundation checks (not an Android release)
on:
  push:
    branches: [codex/chaos-phase1]
  pull_request:
    paths:
      - 'app/src/main/assets/www/story-*'
      - 'qa/story-*'
      - '.github/workflows/story-foundation.yml'
permissions:
  contents: read
concurrency:
  group: story-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot tracked source for reproducible review
        run: |
          python - <<'PY'
          import pathlib, subprocess, zipfile
          suffixes = {'.js', '.cjs', '.html', '.css', '.json', '.py', '.sh', '.java', '.xml', '.kts', '.properties', '.yml', '.md', '.txt', '.sha256'}
          with zipfile.ZipFile('story-source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
                  p = pathlib.Path(name)
                  if name and p.suffix in suffixes and not name.startswith(('art-source/', 'art_b64/')):
                      z.write(p, name)
              z.writestr('SOURCE_COMMIT.txt', subprocess.check_output(['git', 'rev-parse', 'HEAD']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: story-source-${{ github.sha }}
          path: story-source.zip
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic state and scene tests
        run: |
          node --check app/src/main/assets/www/story-engine.js
          node --check app/src/main/assets/www/story-scenes.js
          node --check app/src/main/assets/www/story-lab.js
          node --test qa/story-engine.test.cjs
      - name: Restore the existing game artwork
        run: |
          python -m pip install -r requirements-art.txt
          python scripts/rebuild_art.py
      - name: Install the pinned browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser interaction and viewport checks
        run: node qa/story-browser.cjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-foundation-${{ github.sha }}
          path: qa/results/story-foundation/
          if-no-files-found: warn
